[package]
name = "keplemon"
version = "3.0.0"
edition = "2024"
build = "build.rs"
exclude = [
  "tests/**",
  "benches/**",
  "benchmarks/**",
  "skills/**",
  "venv/**",
  "truth/**",
  "fort.*",
  "AI.md",
  "CONTRIBUTING.md",
  "agents.yaml",
  "assets/**",
  "lib/**",
]

[dependencies]
ctor = "0.6.3"
nalgebra = "0.34.1"
pyo3 = { version = "0.27.2", optional = true }
pyo3-log = "0.13.2"
rayon = "1.11.0"
saal = "0.1.0"
uuid = { version = "1.19.0", features = ["v4"] }

[build-dependencies]
saal = "0.1.0"

[lib]
crate-type = ["cdylib"]
name = "keplemon"

[dev-dependencies]
approx = "0.5.1"

[features]
python = ["pyo3/extension-module", "pyo3/abi3-py310"]
